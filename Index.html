<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Lucas Henrique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .hero-subtitle {
      color: #a0b4c8;
      font-size: 1rem;
    }

    .card-glass {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #webcam-container canvas {
      border-radius: 1rem;
      width: 100% !important;
      height: auto !important;
      max-width: 340px;
      display: block;
      margin: 0 auto;
      border: 2px solid rgba(99, 179, 237, 0.4);
      box-shadow: 0 0 24px rgba(99, 179, 237, 0.15);
    }

    .webcam-placeholder {
      width: 100%;
      max-width: 340px;
      height: 240px;
      margin: 0 auto;
      border-radius: 1rem;
      background: rgba(255,255,255,0.04);
      border: 2px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
      gap: 0.5rem;
    }

    .btn-start {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 0.75rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.6);
      color: #fff;
    }

    .btn-start:active {
      transform: scale(0.97);
    }

    .btn-start:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .label-item {
      background: rgba(255,255,255,0.04);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .label-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }

    .label-value {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .progress {
      height: 10px;
      border-radius: 1rem;
      background: rgba(255,255,255,0.08);
    }

    .progress-bar {
      border-radius: 1rem;
      transition: width 0.3s ease;
    }

    .progress-bar.low    { background: linear-gradient(90deg, #64748b, #94a3b8); }
    .progress-bar.medium { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .progress-bar.high   { background: linear-gradient(90deg, #10b981, #34d399); }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-idle    { background: rgba(100,116,139,0.25); color: #94a3b8; }
    .status-running { background: rgba(16,185,129,0.2);  color: #34d399; }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      display: inline-block;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    footer {
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container py-5">

    <!-- Header -->
    <div class="text-center mb-5">
      <div class="mb-2">
        <i class="bi bi-cpu" style="font-size:2rem; color:#6366f1;"></i>
      </div>
      <h1 class="hero-title">Lucas Henrique</h1>
      <p class="hero-subtitle">Reconhecimento de imagem com Teachable Machine</p>
    </div>

    <!-- Main card -->
    <div class="card-glass p-4 p-md-5 mb-4">
      <div class="row g-4 align-items-start">

        <!-- Webcam -->
        <div class="col-12 col-md-5 text-center">
          <div id="webcam-placeholder" class="webcam-placeholder mb-3">
            <i class="bi bi-camera-video" style="font-size:2rem;"></i>
            <span>Câmera inativa</span>
          </div>
          <div id="webcam-container" class="mb-3"></div>

          <!-- Status -->
          <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
            <span id="status-badge" class="status-badge status-idle">
              <i class="bi bi-circle-fill me-1" style="font-size:0.5rem; vertical-align:middle;"></i>
              Aguardando
            </span>
          </div>

          <!-- Botão -->
          <button id="btn-start" class="btn btn-start" onclick="toggleCamera()">
            <i class="bi bi-play-fill me-2"></i>Ativar Câmera
          </button>
        </div>

        <!-- Labels -->
        <div class="col-12 col-md-7">
          <h5 class="fw-semibold mb-1" style="color:#e2e8f0;">
            <i class="bi bi-bar-chart-line me-2" style="color:#6366f1;"></i>Resultados
          </h5>
          <p class="mb-4" style="font-size:0.82rem; color:#64748b;">
            As barras indicam a probabilidade de correspondência para cada classe.
          </p>
          <div id="label-container" class="d-flex flex-column gap-3">
            <div class="label-item text-center py-4" style="color:rgba(255,255,255,0.2);">
              <i class="bi bi-hourglass" style="font-size:1.5rem;"></i>
              <p class="mt-2 mb-0" style="font-size:0.85rem;">Inicie a câmera para ver os resultados</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
      <p class="mb-0">Desenvolvido por Lucas Henrique &mdash; Powered by Teachable Machine &amp; TensorFlow.js</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/Uj6vjbIvE/";
    let model = null;
    let webcam = null;
    let labelContainer = null;
    let maxPredictions = 0;
    let animationFrameId = null;
    let isRunning = false;

    function getBarClass(prob) {
      if (prob >= 0.65) return "high";
      if (prob >= 0.30) return "medium";
      return "low";
    }

    function updateStatus(running) {
      const badge = document.getElementById("status-badge");
      if (running) {
        badge.className = "status-badge status-running";
        badge.innerHTML = '<span class="pulse-dot me-1"></span>Analisando';
      } else {
        badge.className = "status-badge status-idle";
        badge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:0.5rem; vertical-align:middle;"></i>Aguardando';
      }
    }

    function toggleCamera() {
      const btn = document.getElementById("btn-start");
      if (isRunning) {
        stopCamera(btn);
      } else {
        startCamera(btn);
      }
    }

    async function startCamera(btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Carregando...';

      try {
        if (!model) {
          const modelURL = URL + "model.json";
          const metadataURL = URL + "metadata.json";
          model = await tmImage.load(modelURL, metadataURL);
          maxPredictions = model.getTotalClasses();
        }

        if (!webcam) {
          webcam = new tmImage.Webcam(340, 340, true);
          await webcam.setup();
        }

        await webcam.play();
        isRunning = true;
        document.getElementById("webcam-placeholder").style.display = "none";
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        updateStatus(true);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-stop-fill me-2"></i>Parar';

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const item = document.createElement("div");
          item.className = "label-item";
          item.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="label-name" id="name-${i}">Classe ${i + 1}</span>
              <span class="label-value" id="val-${i}">0%</span>
            </div>
            <div class="progress">
              <div id="bar-${i}" class="progress-bar low" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>`;
          labelContainer.appendChild(item);
        }

        animationFrameId = window.requestAnimationFrame(loop);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-fill me-2"></i>Ativar Câmera';
        updateStatus(false);
        alert("Erro ao acessar a câmera ou carregar o modelo. Verifique as permissões.");
        console.error(err);
      }
    }

    function stopCamera(btn) {
      isRunning = false;
      if (animationFrameId) {
        window.cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      if (webcam) {
        webcam.stop();
        if (webcam.canvas && webcam.canvas.parentElement) {
          webcam.canvas.parentElement.removeChild(webcam.canvas);
        }
      }

      document.getElementById("webcam-placeholder").style.display = "flex";
      updateStatus(false);
      btn.innerHTML = '<i class="bi bi-play-fill me-2"></i>Ativar Câmera';
    }

    async function loop() {
      if (!isRunning) return;
      webcam.update();
      await predict();
      animationFrameId = window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const pct = Math.round(prob * 100);
        const barEl = document.getElementById("bar-" + i);
        const valEl = document.getElementById("val-" + i);
        const nameEl = document.getElementById("name-" + i);

        nameEl.textContent = prediction[i].className;
        valEl.textContent = pct + "%";
        barEl.style.width = pct + "%";
        barEl.setAttribute("aria-valuenow", pct);
        barEl.className = "progress-bar " + getBarClass(prob);
      }
    }
  </script>

</body>
</html>
